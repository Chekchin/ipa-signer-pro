<!doctype html>
<html lang="km" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHEK STORE - UDID Finder</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='cheklogo.png') }}"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: { brand: { 500: "#06b6d4" }, darkbg: "#090d16" },
            fontFamily: { sans: ["Kantumruy Pro", "sans-serif"] },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-darkbg text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950"
  >
    <!-- HEADER -->
    <header
      class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50"
    >
      <div
        class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-teal-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-cyan-500/20"
          >
            CS
          </div>
          <h1
            class="text-xl font-extrabold bg-gradient-to-r from-cyan-400 to-sky-400 bg-clip-text text-transparent"
          >
            UDID FINDER
          </h1>
        </div>
        <a
          href="/"
          class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all flex items-center gap-1.5 shadow-md"
        >
          <i class="fa-solid fa-house text-cyan-400"></i>
          <span>ទំព័រដើម (Home)</span>
        </a>
      </div>
    </header>

    <!-- CONTENT -->
    <main
      class="flex-1 max-w-lg w-full mx-auto px-4 py-12 flex flex-col items-center justify-center text-center space-y-6"
    >
      <div
        class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 w-full"
      >
        <div
          class="w-20 h-20 mx-auto rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-3xl shadow-lg"
        >
          <i class="fa-solid fa-mobile-screen-button"></i>
        </div>

        <div class="space-y-2">
          <h2 class="text-2xl font-black text-white">
            ទាញយក UDID ពី iPhone / iPad
          </h2>
          <p class="text-xs text-slate-400 leading-relaxed">
            សូមចុចប៊ូតុងខាងក្រោមដើម្បីដំឡើង Profile បញ្ជាក់យក UDID
            របស់ឧបករណ៍លោកបងដោយសុវត្ថិភាព។
          </p>
        </div>

        <!-- ຖ້າទទួលបាន UDID រួចហើយ -->
        <div id="udid-result-section" class="hidden space-y-4 pt-2">
          <div
            class="p-4 bg-slate-950 border border-emerald-500/30 rounded-xl text-left space-y-2"
          >
            <p
              class="text-xs text-emerald-400 font-bold flex items-center gap-1.5"
            >
              <i class="fa-solid fa-circle-check"></i> ទទួលបាន UDID ជោគជ័យ៖
            </p>
            <div
              class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-slate-800"
            >
              <span
                id="udid-text"
                class="text-xs font-mono text-cyan-300 truncate select-all"
              ></span>
              <button
                onclick="copyUdid()"
                class="px-3 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-lg transition-colors shrink-0 ml-2 shadow-md"
              >
                <i class="fa-solid fa-copy"></i>
                <span id="copy-udid-btn">Copy</span>
              </button>
            </div>
          </div>
        </div>

        <!-- ប៊ូតុង Install Profile -->
        <div id="action-btn-section" class="pt-2">
          <a
            href="/profile.mobileconfig"
            class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2 text-base"
          >
            <i class="fa-solid fa-download"></i>
            <span>ទាញយក / Install Profile</span>
          </a>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer
      class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500"
    >
      <p>© 2026 CHEK STORE - UDID Finder Tool. All rights reserved.</p>
    </footer>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const udidVal = urlParams.get("udid");
      if (udidVal) {
        document
          .getElementById("udid-result-section")
          .classList.remove("hidden");
        document.getElementById("udid-text").textContent = udidVal;
        document.getElementById("action-btn-section").style.display = "none";
      }

      function copyUdid() {
        const udidText = document.getElementById("udid-text").textContent;
        navigator.clipboard.writeText(udidText).then(() => {
          const btn = document.getElementById("copy-udid-btn");
          btn.textContent = "Copied!";
          setTimeout(() => {
            btn.textContent = "Copy";
          }, 2000);
        });
      }
    </script>
  </body>
</html>
